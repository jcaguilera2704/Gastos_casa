<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gastos del hogar</title>

  <!-- viewport-fit=cover para que la app use la pantalla completa en iPhone con notch -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#22302B">
  <meta name="description" content="Gastos compartidos del hogar">

  <!-- Necesario para que iOS la abra sin la barra de Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Gastos">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" href="./icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">

  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <div class="pantalla-carga">
      <div class="spinner"></div>
      <p>Cargando...</p>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          // Sin service worker la app sigue funcionando, solo pierde el modo offline
        });
      });
    }
  </script>
</body>
</html>
